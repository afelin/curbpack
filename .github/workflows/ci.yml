name: ci

on:
  push:
    branches: [main, feature/**]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
      - name: Go test
        run: go test ./...
      - name: Fuzz (short)
        run: |
          go test ./internal/validate/ -fuzz=FuzzSafeJoin -fuzztime=5s
          go test ./internal/validate/ -fuzz=FuzzTextForbidRegex -fuzztime=5s
          go test ./internal/attest/ -fuzz=FuzzParseHPURLFragment -fuzztime=5s

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
      - name: Build
        run: go build -o bin/cyberready ./cmd/cyberready
      - name: Doctor + demo sandbox
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/bin/cyberready" doctor
          DEMO=$(mktemp -d)
          "$GITHUB_WORKSPACE/bin/cyberready" demo --out "$DEMO" --keep
          test -f "$DEMO/review-pack/buyer-onepager.html"
          test -f "$DEMO/.cyberready.json"
      - name: Offline smoke — CRA fixture
        run: |
          set -euo pipefail
          FIX=$(mktemp -d)
          cd "$FIX"
          git init -q
          git config user.email "ci@cyberready.local"
          git config user.name "CI"
          git commit --allow-empty -m init -q
          "$GITHUB_WORKSPACE/bin/cyberready" init --packs cra-baseline
          # Bind annex drafts to a resolvable product token (package.json name).
          # CRA-ANNEX-VII-RISK also require_tree_paths README.md (always present post-init/heal in product repos).
          printf '%s\n' '# contoso-gateway' > README.md
          printf '%s\n' '{"name":"contoso-gateway","version":"1.0.0","dependencies":{}}' > package.json
          # Fill annex stubs past placeholders / min sizes
          cat > docs/annex-vii/risk_assessment.md <<'EOF'
          # Risk Assessment

          ## Product Overview

          The contoso-gateway product forwards telemetry from clinical devices to a hospital EHR over mutually authenticated TLS.

          ## Identified Risks

          | Risk ID | Description | Severity | Mitigation |
          |---------|-------------|----------|------------|
          | R-001   | Credential stuffing on admin UI | High | MFA + lockout |

          ## Residual Risk Statement

          Residual risk is accepted by the product owner after mitigations above.
          EOF
          cat > docs/annex-vii/support_period.md <<'EOF'
          # Support Period

          ## End of Support

          Security updates for contoso-gateway are provided for five years from the general availability date of each major release.

          ## Rationale

          Aligned with expected clinical deployment lifetime and spare-parts availability.
          EOF
          cat > docs/annex-vii/user_manual_security.md <<'EOF'
          # User Manual — Security

          ## Secure Configuration

          Disable default accounts on contoso-gateway, enforce MFA, and restrict management interfaces to the hospital VLAN.

          ## Product Disposal

          Factory-reset the appliance, shred exported key material, and confirm cloud tenant deletion.
          EOF
          "$GITHUB_WORKSPACE/bin/cyberready" check
          "$GITHUB_WORKSPACE/bin/cyberready" prepare-release
          test -f review-pack/buyer-onepager.html
          test -f .github/cyberready/cache/latest_action_report.md

      - name: Offline smoke — house-policy fixture
        run: |
          set -euo pipefail
          FIX=$(mktemp -d)
          cd "$FIX"
          git init -q
          git config user.email "ci@cyberready.local"
          git config user.name "CI"
          git commit --allow-empty -m init -q
          "$GITHUB_WORKSPACE/bin/cyberready" init --packs house-policy --hooks --skill --ide
          test -x .git/hooks/pre-commit
          grep -q 'cyberready check --heal' .git/hooks/pre-commit
          test -f .cursor/skills/cyberready/SKILL.md
          test -f .vscode/tasks.json
          "$GITHUB_WORKSPACE/bin/cyberready" check
          # bare cyberready defaults to check when inited
          "$GITHUB_WORKSPACE/bin/cyberready"
          "$GITHUB_WORKSPACE/bin/cyberready" check --form-hints || true
          echo '{"name":"demo","dependencies":{"left-pad":"1.3.0"}}' > package.json
          "$GITHUB_WORKSPACE/bin/cyberready" prepare-release --allow-failing-gates
          test -f .github/cyberready/evidence/sbom.cdx.json
          python3 - <<'PY'
          import json
          d=json.load(open(".github/cyberready/evidence/sbom.cdx.json"))
          assert d["bomFormat"]=="CycloneDX" and d["specVersion"]=="1.5"
          v=json.load(open(".github/cyberready/evidence/vex-pending.json"))
          assert v["status"]=="draft_pending_attest"
          print("cyclonedx+vex ok")
          PY
          git add -A && git -c commit.gpgsign=false commit --no-verify -m "evidence" -q
          "$GITHUB_WORKSPACE/bin/cyberready" attest --allow-dirty
          test -f .github/cyberready/evidence/hpurl-pointer.json
          python3 - <<'PY'
          import json
          p=json.load(open(".github/cyberready/evidence/hpurl-pointer.json"))
          assert p.get("state_hash") and p["state_hash"] in p.get("hpurl","")
          print("hpurl pointer ok", p["state_hash"][:12])
          PY
          # Hook dry-run: script is executable and references check
          head -n 5 .git/hooks/pre-commit
          grep -q 'refusing commit' .git/hooks/pre-commit
          H1=$(python3 -c 'import json;print(json.load(open(".github/cyberready/evidence/hpurl-pointer.json"))["state_hash"])')
          "$GITHUB_WORKSPACE/bin/cyberready" attest --allow-dirty >/dev/null
          H2=$(python3 -c 'import json;print(json.load(open(".github/cyberready/evidence/hpurl-pointer.json"))["state_hash"])')
          test "$H1" = "$H2"

  redteam-pilot:
    # Stable check name for branch protection: merges to main require this green.
    name: redteam-pilot
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
      - name: Build
        run: go build -o bin/cyberready ./cmd/cyberready
      - name: Redteam pilot scoreboard (required)
        run: ./scripts/redteam-pilot.sh

  gauntlet:
    runs-on: ubuntu-latest
    needs: [test, redteam-pilot]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
      - name: Build
        run: go build -o bin/cyberready ./cmd/cyberready
      - name: Claim safety (docs + runtime)
        run: ./scripts/claim-safety.sh
      - name: Heal smoke + baseline ratchet + dead-ends
        run: ./scripts/gauntlet-ratchet.sh
      - name: Install-from-release smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          INST=$(mktemp -d)
          export CYBERREADY_INSTALL_DIR="$INST"
          export CYBERREADY_VERSION="${CYBERREADY_VERSION:-latest}"
          # Prefer latest release binary; fall back to workspace build if download fails (fork PRs).
          if curl -fsSL https://raw.githubusercontent.com/afelin/cyberready/main/scripts/install.sh | sh; then
            export PATH="$INST:$PATH"
            cyberready doctor
            DEMO=$(mktemp -d)
            cyberready demo --out "$DEMO" --keep
            test -f "$DEMO/review-pack/buyer-onepager.html"
          else
            echo "release install unavailable — falling back to workspace binary"
            "$GITHUB_WORKSPACE/bin/cyberready" doctor
            DEMO=$(mktemp -d)
            "$GITHUB_WORKSPACE/bin/cyberready" demo --out "$DEMO" --keep
            test -f "$DEMO/review-pack/buyer-onepager.html"
          fi
      - name: Dead-end — corrupt pack env
        run: |
          set -euo pipefail
          BAD=$(mktemp -d)
          mkdir -p "$BAD/broken"
          echo '{not json' > "$BAD/broken/pack.json"
          FIX=$(mktemp -d)
          cd "$FIX"
          git init -q
          git config user.email "ci@cyberready.local"
          git config user.name "CI"
          git commit --allow-empty -m init -q
          set +e
          CYBERREADY_PACKS_DIR="$BAD" "$GITHUB_WORKSPACE/bin/cyberready" init --packs broken
          code=$?
          set -e
          test "$code" -ne 0
      - name: Chaos dead-ends
        run: ./scripts/chaos-deadends.sh "$GITHUB_WORKSPACE/bin/cyberready"
