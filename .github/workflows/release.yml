name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.5.0); leave empty to use github.ref_name"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VER="${TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Cross-compile
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for pair in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS=${pair%/*}
            GOARCH=${pair#*/}
            out="dist/curbpack_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "building $out"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath \
              -ldflags="-s -w -X github.com/afelin/curbpack/internal/buildinfo.Version=${VERSION}" \
              -o "$out" ./cmd/curbpack
          done
          (cd dist && sha256sum curbpack_* > checksums.txt)
          # Parity with scripts/install-manifest.json
          python3 - <<'PY'
          import json, pathlib
          man = json.loads(pathlib.Path("scripts/install-manifest.json").read_text())
          dist = {p.name for p in pathlib.Path("dist").glob("curbpack_*")}
          missing = [a for a in man["assets"] if a not in dist]
          if missing:
              raise SystemExit(f"release assets missing vs manifest: {missing}")
          print("release↔manifest ok", sorted(dist))
          PY
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: curbpack-binaries
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/curbpack_* dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/curbpack_* dist/checksums.txt \
              --title "Curbpack ${TAG}" \
              --notes "$(cat <<EOF
          ## Curbpack ${TAG}

          Local evidence CLI — prepares review packs for **human review**. Not a conformity assessment or certification.

          ### Provenance

          Built by workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Install scripts verify \`checksums.txt\` (sha256) fail-closed. Asset \`curbpack_windows_amd64.exe\` is published for local Windows CLI. GitHub Action runners remain Linux/macOS only.

          ### Install (no Go)

          **macOS / Linux**
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/afelin/curbpack/main/scripts/install.sh | sh
          curbpack doctor && curbpack demo
          \`\`\`

          **Windows (PowerShell)**
          \`\`\`powershell
          irm https://raw.githubusercontent.com/afelin/curbpack/main/scripts/install.ps1 | iex
          curbpack doctor; curbpack demo
          \`\`\`

          Full ladders: [docs/getting-started/install.md](https://github.com/afelin/curbpack/blob/main/docs/getting-started/install.md)

          ### Claim safety

          Gate pass prepares evidence for human review — not CE marking, notified-body approval, or certification.
          EOF
          )"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish npm wrapper
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish (human one-time setup)" >&2
            exit 0
          fi
          VER="${{ steps.ver.outputs.version }}"
          node -e "const p=require('./package.json'); p.version='${VER}'; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
          npm publish --access public
