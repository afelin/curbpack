name: 'CyberReady Check'
description: 'Run CyberReady evidence gates on a product repo. Prepares human-review evidence — not a conformity assessment.'
author: 'afelin'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  version:
    description: 'Release tag to download (e.g. v0.4.2). Empty = build from this checkout if go.mod is cyberready, else download v0.4.2 (never floating latest).'
    required: false
    default: ''
  packs:
    description: 'Optional comma-separated pack override for check (empty = .cyberready.json / house-policy default)'
    required: false
    default: ''
  diff:
    description: 'Delta mode — not release-gate safe. If true, pass --diff (only changed files; required-file gates still run). Default false for full-scan release gates.'
    required: false
    default: 'false'
  heal:
    description: 'If true, run check --heal (missing stubs only; never attest)'
    required: false
    default: 'true'
  prepare_release:
    description: 'If true, also run prepare-release and upload buyer-onepager'
    required: false
    default: 'true'
  comment_pr:
    description: 'Deprecated — prefer comment_on. If false, never comment (overrides comment_on).'
    required: false
    default: 'true'
  comment_on:
    description: 'PR comment policy: red (default — only when gates fail or first sticky), always, never'
    required: false
    default: 'red'
  upload_sarif:
    description: 'If true, write and upload SARIF for gate failures (annotations in PR UI)'
    required: false
    default: 'true'
  working_directory:
    description: 'Product repo path (relative to workspace)'
    required: false
    default: '.'

outputs:
  score:
    description: 'Readiness score percent from Action Report / cache'
    value: ${{ steps.score.outputs.score }}
  passed:
    description: 'true if check exited 0'
    value: ${{ steps.run.outputs.passed }}

runs:
  using: composite
  steps:
    - name: Resolve cyberready binary
      id: bin
      shell: bash
      run: |
        set -euo pipefail
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64|amd64) ARCH=amd64 ;;
          aarch64|arm64) ARCH=arm64 ;;
        esac
        ASSET="cyberready_${OS}_${ARCH}"
        DEST="${{ github.action_path }}/cyberready"
        VER="${{ inputs.version }}"
        # Never prefer consumer ./bin/cyberready — that skips checksum verification and
        # lets a PR ship a fake-green binary. Dogfood builds from this module; others
        # download a pinned release and verify sha256 against checksums.txt (fail-closed).
        if command -v go >/dev/null 2>&1 && [ -f go.mod ] && grep -q 'module github.com/afelin/cyberready' go.mod 2>/dev/null; then
          go build -o "$DEST" ./cmd/cyberready
          echo "source=built" >> "$GITHUB_OUTPUT"
        else
          # Empty version → pin v0.4.2 (never silent floating latest).
          if [ -z "$VER" ] || [ "$VER" = "latest" ]; then
            if [ "$VER" = "latest" ]; then
              echo "inputs.version=latest is deprecated; downloading v0.4.2 instead" >&2
            fi
            VER="v0.4.2"
          fi
          URL="https://github.com/afelin/cyberready/releases/download/${VER}/${ASSET}"
          CHECKSUMS_URL="https://github.com/afelin/cyberready/releases/download/${VER}/checksums.txt"
          if [ -z "${URL:-}" ]; then
            echo "Could not resolve release binary ${ASSET}. Build cyberready or set inputs.version." >&2
            exit 1
          fi
          if [ -z "${CHECKSUMS_URL:-}" ]; then
            echo "checksums.txt URL missing — refusing download (fail closed, same as install.sh)" >&2
            exit 1
          fi
          # Network install: retry once (max 2 attempts) — never retry gate logic.
          set +e
          curl -fsSL -o "$DEST" "$URL"
          code=$?
          if [ "$code" -ne 0 ]; then
            sleep 2
            curl -fsSL -o "$DEST" "$URL"
            code=$?
          fi
          set -e
          if [ "$code" -ne 0 ]; then
            echo "download failed for ${ASSET}" >&2
            exit 1
          fi
          # Fail-closed sha256 verify (parity with scripts/install.sh)
          curl -fsSL -o "${DEST}.checksums.txt" "$CHECKSUMS_URL"
          expected=$(grep -E "[ /]${ASSET}\$" "${DEST}.checksums.txt" | head -n 1 | awk '{print $1}')
          if [ -z "${expected:-}" ]; then
            echo "no checksum entry for ${ASSET} in checksums.txt — refusing install" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$DEST" | awk '{print $1}')
          elif command -v shasum >/dev/null 2>&1; then
            actual=$(shasum -a 256 "$DEST" | awk '{print $1}')
          else
            echo "neither sha256sum nor shasum found — refusing install" >&2
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "checksum mismatch for ${ASSET}" >&2
            echo "  expected: ${expected}" >&2
            echo "  actual:   ${actual}" >&2
            exit 1
          fi
          echo "Checksum OK (${actual})"
          chmod +x "$DEST"
          rm -f "${DEST}.checksums.txt"
          echo "source=release" >> "$GITHUB_OUTPUT"
        fi
        echo "path=$DEST" >> "$GITHUB_OUTPUT"

    - name: Run cyberready check
      id: run
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        BIN="${{ steps.bin.outputs.path }}"
        EXTRA=()
        if [ -n "${{ inputs.packs }}" ]; then
          EXTRA+=(--packs "${{ inputs.packs }}")
        fi
        if [ "${{ inputs.diff }}" = "true" ]; then
          EXTRA+=(--diff)
        fi
        if [ "${{ inputs.heal }}" = "true" ]; then
          EXTRA+=(--heal)
        fi
        set +e
        "$BIN" check "${EXTRA[@]}" | tee /tmp/cyberready-check.txt
        CODE=${PIPESTATUS[0]}
        set -e
        if [ "$CODE" -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi
        mkdir -p .github/cyberready/cache
        cp /tmp/cyberready-check.txt .github/cyberready/cache/ci-check-log.txt || true
        exit 0

    - name: Annotations + SARIF
      if: inputs.upload_sarif == 'true'
      id: sarif
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        BIN="${{ steps.bin.outputs.path }}"
        OUT=".github/cyberready/cache/cyberready.sarif"
        mkdir -p .github/cyberready/cache
        # Prefer CLI SARIF (single Go source of truth); fall back to annotations-only if export missing.
        if "$BIN" export --sarif --out "$OUT" 2>/tmp/cyberready-sarif.err; then
          :
        else
          echo "export --sarif failed; writing empty SARIF shell" >&2
          cat /tmp/cyberready-sarif.err >&2 || true
          printf '%s\n' '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"cyberready","informationUri":"https://github.com/afelin/cyberready","rules":[]}},"results":[]}]}' > "$OUT"
        fi
        # GitHub Actions annotations from latest_failure.json
        python3 <<'PY'
        import json, pathlib
        fail_path = pathlib.Path(".github/cyberready/cache/latest_failure.json")
        if not fail_path.exists():
            raise SystemExit(0)
        try:
            data = json.loads(fail_path.read_text())
        except Exception:
            raise SystemExit(0)
        for f in data.get("failures") or []:
            gate = f.get("gate_id") or "GATE"
            sev = (f.get("severity") or "warning").lower()
            level = "error" if sev in ("high", "critical") else "warning"
            desc = f.get("sanitized_description") or gate
            file = (f.get("ast_coordinates") or {}).get("target_file") or ""
            if file:
                print(f"::{level} file={file},line=1::{gate}: {desc}")
            else:
                print(f"::{level}::{gate}: {desc}")
        PY
        echo "path=.github/cyberready/cache/cyberready.sarif" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: inputs.upload_sarif == 'true' && steps.run.outputs.passed != 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
      with:
        sarif_file: ${{ inputs.working_directory }}/.github/cyberready/cache/cyberready.sarif
        category: cyberready

    - name: Prepare release artifacts
      if: inputs.prepare_release == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        BIN="${{ steps.bin.outputs.path }}"
        EXTRA=()
        if [ -n "${{ inputs.packs }}" ]; then
          EXTRA+=(--packs "${{ inputs.packs }}")
        fi
        "$BIN" prepare-release "${EXTRA[@]}" || true

    - name: Read score
      id: score
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        SCORE="0"
        if [ -f .github/cyberready/cache/latest_failure.json ]; then
          SCORE=$(python3 -c 'import json;print(json.load(open(".github/cyberready/cache/latest_failure.json")).get("readiness_score",0))' 2>/dev/null || echo 0)
        elif [ -f .github/cyberready/cache/latest_action_report.md ]; then
          SCORE=$(sed -n 's/.*Readiness[^0-9]*\([0-9][0-9]*\).*/\1/p' .github/cyberready/cache/latest_action_report.md | head -n1)
          SCORE=${SCORE:-0}
        fi
        echo "score=${SCORE}" >> "$GITHUB_OUTPUT"

    - name: Upload buyer-onepager
      if: inputs.prepare_release == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: cyberready-buyer-onepager
        path: |
          ${{ inputs.working_directory }}/review-pack/buyer-onepager.html
          ${{ inputs.working_directory }}/.github/cyberready/cache/latest_action_report.md
          ${{ inputs.working_directory }}/.github/cyberready/cache/latest_failure.json
          ${{ inputs.working_directory }}/.github/cyberready/cache/cyberready.sarif
        if-no-files-found: warn

    - name: PR sticky comment (red-only by default)
      if: inputs.comment_pr == 'true' && inputs.comment_on != 'never' && github.event_name == 'pull_request'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        COMMENT_ON: ${{ inputs.comment_on }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const root = '${{ inputs.working_directory }}';
          const score = '${{ steps.score.outputs.score }}' || '0';
          const passed = '${{ steps.run.outputs.passed }}' === 'true';
          const mode = (process.env.COMMENT_ON || 'red').toLowerCase();
          const claim = 'Prepares evidence for human review — not a conformity assessment or certification.';

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('<!-- cyberready-sticky -->'));

          // Red-only: comment on fail, or first-run sticky; skip noisy green updates.
          if (mode === 'red' && passed && existing) {
            core.info('green + sticky exists — skip comment (zero babysitting)');
            return;
          }
          if (mode === 'red' && passed && !existing) {
            // First-run green: minimal check-mark, no essay.
            const body = [
              '<!-- cyberready-sticky -->',
              '## CyberReady check',
              '',
              `✅ Gates green — readiness **${score}%**`,
              '',
              `> ${claim}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            return;
          }
          if (mode !== 'always' && mode !== 'red') {
            core.info(`unknown comment_on=${mode} — skipping`);
            return;
          }
          if (passed && mode === 'always') {
            // always + green: still keep it short
          }

          let report = '';
          const reportPath = path.join(root, '.github/cyberready/cache/latest_action_report.md');
          if (fs.existsSync(reportPath)) {
            report = fs.readFileSync(reportPath, 'utf8').trim();
            // Truncate to avoid leaking large doc excerpts into PR comments; prefer annotations/SARIF.
            const maxReport = 1200;
            if (report.length > maxReport) {
              report = report.slice(0, maxReport) + '\n\n_(truncated — see SARIF / annotations / latest_action_report.md)_';
            }
          }
          let fails = [];
          const failPath = path.join(root, '.github/cyberready/cache/latest_failure.json');
          if (fs.existsSync(failPath)) {
            try {
              const j = JSON.parse(fs.readFileSync(failPath, 'utf8'));
              fails = (j.failures || []).slice(0, 3).map(f => {
                const desc = String(f.sanitized_description || '').slice(0, 160);
                return `- \`${f.gate_id}\` (${f.severity}): ${desc}`;
              });
            } catch (_) {}
          }
          const barFilled = Math.max(0, Math.min(20, Math.floor(Number(score) / 5)));
          const thermo = '█'.repeat(barFilled) + '·'.repeat(20 - barFilled);
          const body = [
            '<!-- cyberready-sticky -->',
            '## CyberReady check',
            '',
            `**Readiness:** ${score}% \`${thermo}\` — ${passed ? 'gates green' : 'gates need attention'}`,
            '',
            fails.length ? '### Top findings\n' + fails.join('\n') : '### Top findings\n_No gate failures in cache._',
            '',
            !passed && report ? '<details><summary>Action Report (truncated)</summary>\n\n' + report + '\n</details>' : '',
            '',
            '_Prefer PR annotations / SARIF over this comment for full detail._',
            '',
            `> ${claim}`,
            '',
            '_Ask:_ `cyberready ask .github/cyberready/cache/latest_failure.json --propose`',
          ].filter(Boolean).join('\n');

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Fail job if check failed
      if: steps.run.outputs.passed != 'true'
      shell: bash
      run: |
        echo "cyberready check failed (not a certification result — evidence for human review)."
        exit 1
