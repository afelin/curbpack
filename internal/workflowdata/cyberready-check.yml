# Drop-in GitHub Action workflow for CyberReady.
# Copy to .github/workflows/cyberready.yml — pin stays @v0.4.2.
name: cyberready-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: CyberReady check
        uses: afelin/cyberready@v0.4.2
        with:
          version: v0.4.2
          heal: "true"
          prepare_release: "true"
          comment_on: red
          upload_sarif: "true"
